name: PR integration tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run integration tests
        run: ./mvnw clean integration-test
